<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contribute</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<style>
  :root {
    --bg:#07090c; --panel:#12161c; --border:#252c36; --text:#e6edf3; --muted:#8b949e;
    --accent:#2f81f7; --go:#238636; --danger:#f85149;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  .status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.live { background:var(--go); } .dot.dead { background:var(--danger); }
  .spacer { flex:1; }
  button { font:inherit; font-size:13px; padding:7px 14px; border-radius:7px;
    border:1px solid var(--border); background:#1b222b; color:var(--text); cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button.go { background:var(--go); border-color:var(--go); }
  button:disabled { opacity:.5; cursor:default; }
  #termWrap { flex:1; min-height:0; padding:8px 10px; }
  #term { height:100%; }
  #empty { margin:60px auto; max-width:460px; text-align:center; color:var(--muted); }
  footer { background:var(--panel); border-top:1px solid var(--border); padding:10px 16px; }
  .composer { display:flex; gap:10px; align-items:flex-end; max-width:1100px; margin:0 auto; }
  textarea { flex:1; resize:none; min-height:44px; max-height:180px; padding:10px 12px;
    border-radius:9px; border:1px solid var(--border); background:#0b0e13; color:var(--text); font:inherit; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .keys { max-width:1100px; margin:0 auto 8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .keys .lbl { font-size:11px; color:var(--muted); margin-right:2px; }
  .keys button { padding:5px 10px; font-size:12px; min-width:34px; }
  .row2 { max-width:1100px; margin:8px auto 0; display:flex; justify-content:space-between; gap:12px; }
  .hint { font-size:11px; color:var(--muted); }
  .pr { font-size:12px; color:var(--muted); } .pr a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Contribute</h1>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></span>
  <span class="spacer"></span>
  <button id="submitBtn" class="go" disabled>Submit for review</button>
</header>
<div id="termWrap"><div id="empty">Waiting for a session to be started for you…</div><div id="term" style="display:none"></div></div>
<footer>
  <div class="keys" id="keys" title="Use these to answer Claude's on-screen menus (arrow-select, numbered options)">
    <span class="lbl">Menu keys:</span>
    <button data-key="up" disabled>↑</button>
    <button data-key="down" disabled>↓</button>
    <button data-key="left" disabled>←</button>
    <button data-key="right" disabled>→</button>
    <button data-key="enter" disabled>⏎ Enter</button>
    <button data-key="esc" disabled>Esc</button>
    <button data-key="1" disabled>1</button>
    <button data-key="2" disabled>2</button>
    <button data-key="3" disabled>3</button>
  </div>
  <div class="composer">
    <textarea id="input" placeholder="Describe a change… (Enter to send, Shift+Enter for newline)" disabled></textarea>
    <button id="sendBtn" disabled>Send</button>
  </div>
  <div class="row2">
    <span class="hint">You talk to Claude in plain language — it explores the code and makes the changes. No shell, no repo download, no direct push; work lands as a PR John reviews.</span>
    <span class="pr" id="pr"></span>
  </div>
</footer>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || localStorage.getItem('sm_contributor_token') || '';
  if (params.get('token')) localStorage.setItem('sm_contributor_token', token);

  var dot = document.getElementById('dot'), statusText = document.getElementById('statusText');
  var emptyEl = document.getElementById('empty'), termEl = document.getElementById('term');
  var input = document.getElementById('input'), sendBtn = document.getElementById('sendBtn');
  var submitBtn = document.getElementById('submitBtn'), prEl = document.getElementById('pr');
  var keyBtns = Array.prototype.slice.call(document.querySelectorAll('#keys button[data-key]'));

  var haveSession = false, term = null, fit = null, termBytes = 0, connected = false;

  function hdr(extra) { return Object.assign({ 'Authorization': 'Bearer ' + token }, extra || {}); }
  function api(path, opts) { opts = opts || {}; opts.headers = hdr(opts.headers); return fetch('/api/contributor' + path, opts); }

  function setLive(live, label) {
    dot.className = 'dot ' + (live ? 'live' : 'dead');
    statusText.textContent = label;
    input.disabled = sendBtn.disabled = submitBtn.disabled = !live;
    keyBtns.forEach(function (b) { b.disabled = !live; });
  }

  function sendKey(key) {
    if (!haveSession) return;
    api('/key', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key }) }).then(function () { setTimeout(pumpHistory, 200); }).catch(function () {});
  }
  keyBtns.forEach(function (b) { b.addEventListener('click', function () { sendKey(b.getAttribute('data-key')); }); });

  function ensureTerm() {
    if (term) return;
    emptyEl.style.display = 'none'; termEl.style.display = 'block';
    term = new Terminal({ convertEol: true, fontSize: 12, theme: { background: '#07090c' }, scrollback: 6000, disableStdin: true });
    fit = new FitAddon.FitAddon(); term.loadAddon(fit);
    term.open(termEl); try { fit.fit(); } catch (e) {}
    pushResize();
    window.addEventListener('resize', function () { try { fit.fit(); pushResize(); } catch (e) {} });
  }
  function pushResize() {
    if (!term) return;
    api('/resize', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cols: term.cols, rows: term.rows }) }).catch(function () {});
  }

  function pumpHistory() {
    if (!haveSession || !term) return;
    var qs = termBytes > 0 ? '?after=' + termBytes : '';
    api('/history' + qs).then(function (r) {
      if (!r.ok) return null;
      var total = parseInt(r.headers.get('X-Sm-Total-Bytes') || '0', 10) || 0;
      return r.text().then(function (txt) { if (txt) term.write(txt); termBytes = total; });
    }).catch(function () {});
  }

  function pollSession() {
    api('/session').then(function (r) {
      if (r.status === 404) { haveSession = false; setLive(false, 'no session yet'); return null; }
      if (r.status === 401 || r.status === 403) { setLive(false, 'unauthorized'); return null; }
      return r.json();
    }).then(function (s) {
      if (!s) return;
      var live = s.status === 'running';
      if (live && !connected) { connected = true; haveSession = true; ensureTerm(); termBytes = 0; pumpHistory(); }
      haveSession = live;
      setLive(live, live ? ('live · ' + s.project + ' · Sonnet') : 'session ended');
      if (s.prUrl) prEl.innerHTML = 'Submitted → <a href="' + s.prUrl + '" target="_blank" rel="noopener">pull request</a>';
      else if (s.prNote) prEl.textContent = 'Submitted (' + s.prNote + ')';
    }).catch(function () { setLive(false, 'offline'); });
  }

  function send() {
    var msg = input.value.replace(/\s+$/, '');
    if (!msg || !haveSession) return;
    input.value = '';
    api('/input', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: msg }) }).then(function () { setTimeout(pumpHistory, 250); }).catch(function () {});
  }
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  sendBtn.addEventListener('click', send);

  submitBtn.addEventListener('click', function () {
    if (!confirm('Submit your work for review? This opens a pull request.')) return;
    submitBtn.disabled = true; prEl.textContent = 'Submitting…';
    api('/submit', { method: 'POST' }).then(function (r) { return r.json(); }).then(function (pr) {
      if (pr && pr.prUrl) prEl.innerHTML = 'Submitted → <a href="' + pr.prUrl + '" target="_blank" rel="noopener">pull request</a>';
      else prEl.textContent = 'Submitted' + (pr && pr.note ? ' (' + pr.note + ')' : '');
    }).catch(function () { prEl.textContent = 'Submit failed — tell John.'; })
      .finally(function () { submitBtn.disabled = false; });
  });

  if (!token) { setLive(false, 'no token'); emptyEl.textContent = 'Missing access token. Ask John for your link.'; return; }
  pollSession(); setInterval(pollSession, 3000); setInterval(pumpHistory, 800);
})();
</script>
</body>
</html>
